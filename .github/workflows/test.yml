name: CI

on:
  # Run on trunk after every merge or direct push.
  # This provides a canonical post-merge green signal for the trunk branch.
  push:
    branches:
      - trunk

  # Run on all PRs against the simulated merge commit (branch + base).
  # This is the primary pre-merge validation signal.
  pull_request:
    branches: ['**']

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: ESLint — runs in parallel with unit-tests
  # ---------------------------------------------------------------------------
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Job 2: Vitest unit tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
