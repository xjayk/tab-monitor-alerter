name: CI

on:
  # Run on trunk after every merge or direct push.
  # This provides a canonical post-merge green signal for the trunk branch.
  push:
    branches:
      - trunk
    # Skip CI when only doc/asset files changed — they cannot affect
    # lint or test outcomes.
    paths-ignore:
      - '**/*.md'
      - '*.html'
      - '.gitignore'
      - '.gitattributes'

  # Run on all PRs against the simulated merge commit (branch + base).
  # This is the primary pre-merge validation signal.
  pull_request:
    branches: ['**']
    # Same exclusions as push — doc/asset-only PRs skip CI.
    paths-ignore:
      - '**/*.md'
      - '*.html'
      - '.gitignore'
      - '.gitattributes'

# ---------------------------------------------------------------------------
# Concurrency: cancel superseded runs on the same PR or branch.
#
# For pull_request: each PR gets its own group (by PR number). A new push
# cancels any in-progress run for that PR — only the latest commit matters.
#
# For push to trunk: scoped to the branch name. cancel-in-progress is false
# so a post-merge trunk validation is never silently dropped — runs queue
# instead (fast merges to trunk are rare in practice).
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: ESLint — runs in parallel with unit-tests and integration-tests
  # ---------------------------------------------------------------------------
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Job 2: Vitest unit tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 3: Playwright integration tests (Chrome Extension)
  #
  # Requires --with-deps to install Linux system-level Chromium dependencies
  # (libglib, libnss, libatk, etc.) that are not bundled with the runner.
  # Uses --headless=new (set in playwright.config.js via process.env.CI) so
  # tests run without a display server.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Use npm install (not npm ci) until package-lock.json is regenerated
        # locally to include @playwright/test.
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run integration tests
        run: npm run test:integration
